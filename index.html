<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AI Chat</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-box{
    width:90%;
    max-width:400px;
    background:#1e293b;
    border-radius:15px;
    padding:15px;
}

.messages{
    height:400px;
    overflow:auto;
    background:#0f172a;
    padding:10px;
    border-radius:10px;
    margin-bottom:10px;
}

.msg{
    margin:8px 0;
    padding:10px;
    border-radius:10px;
}

.user{
    background:#2563eb;
    text-align:right;
}

.bot{
    background:#334155;
}

.input-box{
    display:flex;
    gap:10px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat-box">

    <div class="messages" id="messages"></div>

    <div class="input-box">
        <input type="text" id="text" placeholder="اكتب رسالتك...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>

<script>
const API_KEY = "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";

async function sendMessage(){

    const input = document.getElementById("text");
    const messages = document.getElementById("messages");

    const userText = input.value;

    if(!userText) return;

    messages.innerHTML += `
        <div class="msg user">${userText}</div>
    `;

    input.value = "";

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions",{
        method:"POST",
        headers:{
            "Content-Type":"application/json",
            "Authorization":"Bearer " + API_KEY
        },
        body:JSON.stringify({
            model:"llama3-8b-8192",
            messages:[
                {
                    role:"user",
                    content:userText
                }
            ]
        })
    });

    const data = await response.json();

    const botReply = data.choices[0].message.content;

    messages.innerHTML += `
        <div class="msg bot">${botReply}</div>
    `;

    messages.scrollTop = messages.scrollHeight;
}
</script>

</body>
</html>
