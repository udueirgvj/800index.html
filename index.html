<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>
body{
    margin:0;
    background:#07122b;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat{
    width:350px;
    background:#111c36;
    border-radius:15px;
    padding:10px;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.messages{
    height:400px;
    overflow:auto;
    background:#09152f;
    border-radius:10px;
    padding:10px;
    color:white;
}

.msg{
    padding:10px;
    margin:8px 0;
    border-radius:10px;
    width:fit-content;
    max-width:80%;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.bot{
    background:#1e293b;
}

.send{
    display:flex;
    margin-top:10px;
    gap:5px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
    outline:none;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    padding:12px 15px;
    border-radius:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="chat">

    <div class="messages" id="messages"></div>

    <div class="send">
        <input type="text" id="text" placeholder="اكتب رسالتك...">
        <button onclick="sendMessage()">ارسال</button>
    </div>

</div>

<script>

const API_KEY = "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";

async function sendMessage(){

    let text = document.getElementById("text").value;

    if(text == "") return;

    let messages = document.getElementById("messages");

    messages.innerHTML += `
        <div class="msg user">${text}</div>
    `;

    document.getElementById("text").value = "";

    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + API_KEY
                },
                body:JSON.stringify({
                    model:"llama3-8b-8192",
                    messages:[
                        {
                            role:"user",
                            content:text
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        const reply = data.choices[0].message.content;

        messages.innerHTML += `
            <div class="msg bot">${reply}</div>
        `;

        messages.scrollTop = messages.scrollHeight;

    }catch(error){

        messages.innerHTML += `
            <div class="msg bot">
                حدث خطأ
            </div>
        `;
    }

}

</script>

</body>
</html>
