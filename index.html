<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>

<style>

body{
    margin:0;
    background:#07122b;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-box{
    width:350px;
    height:600px;
    background:#111c36;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

.header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;
    font-size:22px;
}

.messages{
    flex:1;
    padding:10px;
    overflow-y:auto;
    background:#09152f;
}

.message{
    padding:10px;
    margin:8px 0;
    border-radius:12px;
    color:white;
    max-width:80%;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.bot{
    background:#1e293b;
}

.input-box{
    display:flex;
    padding:10px;
    gap:5px;
}

input{
    flex:1;
    padding:12px;
    border:none;
    border-radius:10px;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:10px;
}

</style>
</head>

<body>

<div class="chat-box">

<div class="header">
AI Chat
</div>

<div class="messages" id="messages"></div>

<div class="input-box">
<input type="text" id="input" placeholder="اكتب رسالتك">
<button onclick="sendMessage()">ارسال</button>
</div>

</div>

<script>

async function sendMessage(){

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    const text = input.value;

    if(text === "") return;

    messages.innerHTML += `
        <div class="message user">${text}</div>
    `;

    input.value = "";

    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer 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"
                },
                body:JSON.stringify({
                    model:"llama3-8b-8192",
                    messages:[
                        {
                            role:"user",
                            content:text
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        messages.innerHTML += `
            <div class="message bot">
                ${data.choices[0].message.content}
            </div>
        `;

    }catch(error){

        messages.innerHTML += `
            <div class="message bot">
                حدث خطأ
            </div>
        `;
    }

}

</script>

</body>
</html>
