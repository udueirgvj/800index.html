<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ذكاء اصطناعي</title>

<style>

body{
    margin:0;
    background:#07122b;
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.chat-box{
    width:360px;
    height:600px;
    background:#111c36;
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
}

.header{
    background:#2563eb;
    color:white;
    text-align:center;
    padding:15px;
    font-size:20px;
}

.messages{
    flex:1;
    padding:10px;
    overflow-y:auto;
    background:#09152f;
}

.message{
    padding:10px;
    margin:8px 0;
    border-radius:12px;
    max-width:80%;
    color:white;
    word-wrap:break-word;
}

.user{
    background:#2563eb;
    margin-left:auto;
}

.bot{
    background:#1e293b;
}

.input-box{
    display:flex;
    padding:10px;
    background:#111c36;
}

input{
    flex:1;
    border:none;
    border-radius:10px;
    padding:12px;
    outline:none;
}

button{
    border:none;
    background:#2563eb;
    color:white;
    margin-right:5px;
    padding:12px 15px;
    border-radius:10px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="chat-box">

    <div class="header">
        AI Chat
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-box">
        <button onclick="sendMessage()">ارسال</button>
        <input type="text" id="input" placeholder="اكتب رسالتك...">
    </div>

</div>

<script>

const API_KEY = "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";

async function sendMessage(){

    const input = document.getElementById("input");
    const messages = document.getElementById("messages");

    const text = input.value;

    if(text === "") return;

    messages.innerHTML += `
        <div class="message user">${text}</div>
    `;

    input.value = "";

    messages.scrollTop = messages.scrollHeight;

    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + API_KEY
                },
                body:JSON.stringify({
                    model:"llama3-8b-8192",
                    messages:[
                        {
                            role:"user",
                            content:text
                        }
                    ]
                })
            }
        );

        const data = await response.json();

        const reply = data.choices[0].message.content;

        messages.innerHTML += `
            <div class="message bot">${reply}</div>
        `;

        messages.scrollTop = messages.scrollHeight;

    }catch(error){

        messages.innerHTML += `
            <div class="message bot">
                حدث خطأ في الاتصال
            </div>
        `;
    }

}

</script>

</body>
</html>
